<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ML-IDS Risk Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg:#0a0a17; --bg2:#12102a;
  --glow-a:rgba(99,102,241,.35); --glow-b:rgba(168,85,247,.28);
  --panel:rgba(255,255,255,.045); --panel-border:rgba(255,255,255,.09);
  --panel-hi:rgba(255,255,255,.08);
  --text:#e9e9f5; --muted:#9a97b8; --muted2:#6f6c8f;
  --accent:#818cf8; --accent2:#a78bfa;
  --danger:#f5445c; --danger-glow:rgba(245,68,92,.55);
  --safe:#2dd4bf; --safe-glow:rgba(45,212,191,.4);
  --radius:16px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow-x:hidden;
}
.glow{position:fixed; border-radius:50%; filter:blur(90px); z-index:0; pointer-events:none;}
.glow1{width:520px;height:520px; top:-180px; left:-140px; background:var(--glow-a);}
.glow2{width:480px;height:480px; bottom:-200px; right:-160px; background:var(--glow-b);}
.wrap{position:relative; z-index:1; max-width:980px; margin:0 auto; padding:28px 20px 60px;}
header{text-align:center; margin-bottom:22px;}
h1{
  font-size:clamp(22px,4vw,32px); font-weight:800; margin:0 0 6px;
  background:linear-gradient(90deg,#93c5fd,#a78bfa,#f0abfc);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.sub{color:var(--muted); font-size:14px; max-width:560px; margin:0 auto;}
.panel{
  background:var(--panel); border:1px solid var(--panel-border);
  border-radius:var(--radius); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  padding:18px 20px; margin-bottom:16px;
}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
label{font-size:12px; color:var(--muted); display:block; margin-bottom:4px; letter-spacing:.02em;}
input[type=text], select{
  background:rgba(255,255,255,.05); border:1px solid var(--panel-border); color:var(--text);
  border-radius:10px; padding:9px 12px; font-size:13px; font-family:inherit; width:100%;
}
input[type=text]:focus, select:focus{outline:1px solid var(--accent);}
button{
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0a0a17;
  border:none; border-radius:10px; padding:10px 18px; font-weight:700; font-size:13px;
  cursor:pointer; white-space:nowrap;
}
button.ghost{
  background:transparent; color:var(--text); border:1px solid var(--panel-border); font-weight:600;
}
button:active{transform:scale(.98);}
.status{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; padding:5px 12px;
  border-radius:999px; border:1px solid var(--panel-border); color:var(--muted);
}
.dot{width:7px;height:7px;border-radius:50%; background:var(--muted2);}
.status.live .dot{background:var(--safe); box-shadow:0 0 8px var(--safe-glow);}
.status.live{color:var(--safe); border-color:rgba(45,212,191,.3);}
.slider-row{display:flex; align-items:center; gap:14px;}
input[type=range]{flex:1; accent-color:var(--accent);}
.tval{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--accent2); min-width:42px; text-align:right;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px;}
.card{
  background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
  padding:16px; cursor:pointer; transition:border-color .15s;
}
.card:hover{border-color:rgba(129,140,248,.5);}
.card.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
.card h3{margin:0 0 4px; font-size:15px;}
.card .meta{font-size:11.5px; color:var(--muted2); font-family:'JetBrains Mono',monospace;}
.pill{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; margin-top:8px;}
.pill.attack{background:rgba(245,68,92,.15); color:#ff8296; border:1px solid rgba(245,68,92,.35);}
.pill.normal{background:rgba(45,212,191,.13); color:var(--safe); border:1px solid rgba(45,212,191,.3);}
.result{margin-top:44px;}
.result-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
.agree{font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;}
.agree.yes{background:rgba(45,212,191,.13); color:var(--safe);}
.agree.no{background:rgba(245,158,11,.15); color:#fbbf24;}
.model-row{
  display:flex; align-items:center; gap:14px; padding:12px 14px; border-radius:12px;
  background:rgba(255,255,255,.03); border:1px solid var(--panel-border); margin-bottom:10px;
}
.model-row .name{width:170px; font-weight:600; font-size:13.5px; flex-shrink:0;}
.model-row .name small{display:block; color:var(--muted2); font-weight:400; font-size:11px;}
.bar-track{flex:1; height:10px; border-radius:999px; background:rgba(255,255,255,.06); overflow:hidden;}
.bar-fill{height:100%; border-radius:999px; transition:width .5s ease;}
.bar-fill.safe{background:linear-gradient(90deg,#14b8a6,var(--safe));}
.bar-fill.danger{background:linear-gradient(90deg,#ef4444,var(--danger)); box-shadow:0 0 10px var(--danger-glow);}
.score{width:50px; text-align:right; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;}
.verdict{width:66px; text-align:center; font-size:11px; font-weight:800; padding:4px 0; border-radius:8px;}
.verdict.alert{background:rgba(245,68,92,.18); color:#ff8296;}
.verdict.clear{background:rgba(45,212,191,.15); color:var(--safe);}
.note{font-size:12px; color:var(--muted2); line-height:1.5; margin-top:14px;}
.empty{color:var(--muted2); font-size:13px; text-align:center; padding:30px 0;}
footer{text-align:center; color:var(--muted2); font-size:11.5px; margin-top:30px;}
@media (max-width:520px){ .model-row{flex-wrap:wrap;} .model-row .name{width:100%;} }
</style>
</head>
<body>
<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="wrap">

  <header>
    <h1>ML-IDS Multi-Model Risk Console</h1>
    <p class="sub">Score a network connection against every trained model side-by-side and see exactly where they agree — and where they don't.</p>
  </header>

  <div class="panel">
    <div class="row" style="justify-content:space-between;">
      <div style="flex:1; min-width:220px;">
        <label>Backend API URL (optional — leave blank for demo mode)</label>
        <input type="text" id="apiUrl" placeholder="https://your-app.onrender.com">
      </div>
      <div style="display:flex; gap:8px; align-items:flex-end; padding-bottom:1px;">
        <button class="ghost" onclick="connectBackend()">Connect</button>
        <span class="status" id="statusPill"><span class="dot"></span>Demo mode</span>
      </div>
    </div>
    <div class="row" style="margin-top:14px;">
      <div style="flex:1; min-width:220px;">
        <label>Decision threshold — <span class="tval" id="tval">0.50</span></label>
        <div class="slider-row">
          <input type="range" id="threshold" min="0" max="1" step="0.01" value="0.5" oninput="onThreshold()">
        </div>
      </div>
    </div>
  </div>

  <div class="panel">
    <label style="margin-bottom:10px;">Sample connections — pick one to score</label>
    <div class="grid" id="cardGrid"></div>
  </div>

  <div class="result" id="resultBlock" style="display:none;">
    <div class="result-head">
      <h2 style="margin:0; font-size:17px;">Model comparison — <span id="selName"></span></h2>
      <span class="agree" id="agreeBadge"></span>
    </div>
    <div id="modelRows"></div>
    <p class="note" id="modeNote"></p>
  </div>

  <footer>ML-based IDS · Decision Tree · Random Forest · Random Forest + SMOTE</footer>
</div>

<script>
const SAMPLES = [
  {id:1, name:"Normal — web browsing", label:"normal", proto:"tcp/http SF", dt:0.03, rf:0.02, sm:0.06},
  {id:2, name:"Normal — file transfer", label:"normal", proto:"tcp/ftp_data SF", dt:0.05, rf:0.04, sm:0.09},
  {id:3, name:"neptune — SYN flood", label:"attack", proto:"tcp/private S0", dt:0.97, rf:0.99, sm:0.98},
  {id:4, name:"smurf — ICMP flood", label:"attack", proto:"icmp/ecr_i SF", dt:0.95, rf:0.98, sm:0.97},
  {id:5, name:"satan — port probe", label:"attack", proto:"tcp/http_443 REJ", dt:0.31, rf:0.68, sm:0.82},
  {id:6, name:"portsweep — port scan", label:"attack", proto:"tcp/private RSTR", dt:0.42, rf:0.71, sm:0.79},
  {id:7, name:"back — buffer overflow", label:"attack", proto:"tcp/http S0", dt:0.22, rf:0.58, sm:0.74},
  {id:8, name:"ipsweep — host scan", label:"attack", proto:"icmp/eco_i SF", dt:0.38, rf:0.61, sm:0.70},
];
const MODEL_META = [
  {key:"dt", name:"Decision Tree", tag:"fast, interpretable"},
  {key:"rf", name:"Random Forest", tag:"balanced, ensemble"},
  {key:"sm", name:"Random Forest + SMOTE", tag:"tuned for recall"},
];

let selected = null, threshold = 0.5, liveBase = null, liveModels = null;

function renderCards(){
  const grid = document.getElementById("cardGrid");
  grid.innerHTML = SAMPLES.map(s => `
    <div class="card ${selected===s.id?'selected':''}" onclick="selectSample(${s.id})">
      <h3>${s.name}</h3>
      <div class="meta">${s.proto}</div>
      <span class="pill ${s.label}">${s.label === 'attack' ? 'Ground truth: attack' : 'Ground truth: normal'}</span>
    </div>`).join("");
}

function onThreshold(){
  threshold = parseFloat(document.getElementById("threshold").value);
  document.getElementById("tval").textContent = threshold.toFixed(2);
  if(selected !== null) selectSample(selected, true);
}

async function connectBackend(){
  const url = document.getElementById("apiUrl").value.trim().replace(/\/$/, "");
  const pill = document.getElementById("statusPill");
  if(!url){ liveBase = null; pill.className = "status"; pill.innerHTML = "<span class='dot'></span>Demo mode"; return; }
  try{
    const res = await fetch(url + "/models", { signal: AbortSignal.timeout(4000) });
    if(!res.ok) throw new Error("bad response");
    const data = await res.json();
    liveBase = url; liveModels = data.models || [];
    pill.className = "status live"; pill.innerHTML = "<span class='dot'></span>Live — " + liveModels.length + " models";
  }catch(e){
    liveBase = null;
    pill.className = "status"; pill.innerHTML = "<span class='dot'></span>Backend unreachable — demo mode";
  }
  if(selected !== null) selectSample(selected, true);
}

async function selectSample(id, keepScroll){
  selected = id; renderCards();
  const sample = SAMPLES.find(s => s.id === id);
  document.getElementById("resultBlock").style.display = "block";
  document.getElementById("selName").textContent = sample.name;

  let rows = [];
  let note = "Demo mode: scores are illustrative, hand-set to show typical model behaviour on this connection type — connect a deployed backend above for real live inference.";

  if(liveBase){
    try{
      const res = await fetch(liveBase + "/predict_all?threshold=" + threshold, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(sample.raw || {}), signal: AbortSignal.timeout(5000)
      });
      const data = await res.json();
      rows = Object.entries(data.predictions).map(([name, p]) => ({name, score:p.risk_score, alert:p.alert}));
      note = "Live scores from your connected backend's /predict_all endpoint.";
    }catch(e){ rows = []; }
  }

  if(rows.length === 0){
    rows = MODEL_META.map(m => ({name:m.name, tag:m.tag, score:sample[m.key], alert: sample[m.key] >= threshold}));
  }

  const alerts = rows.map(r => r.alert);
  const allAgree = alerts.every(a => a === alerts[0]);
  const badge = document.getElementById("agreeBadge");
  badge.className = "agree " + (allAgree ? "yes" : "no");
  badge.textContent = allAgree ? "✓ Models agree" : "⚠ Models disagree";

  document.getElementById("modelRows").innerHTML = rows.map(r => `
    <div class="model-row">
      <div class="name">${r.name}${r.tag ? `<small>${r.tag}</small>` : ""}</div>
      <div class="bar-track"><div class="bar-fill ${r.alert?'danger':'safe'}" style="width:${Math.round(r.score*100)}%"></div></div>
      <div class="score">${r.score.toFixed(2)}</div>
      <div class="verdict ${r.alert?'alert':'clear'}">${r.alert?'ALERT':'CLEAR'}</div>
    </div>`).join("");
  document.getElementById("modeNote").textContent = note;
}

renderCards();
</script>
</body>
</html>
