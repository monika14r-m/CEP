name: API validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  request-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "fastapi>=0.110" "pydantic>=2.0" "httpx>=0.27" "pytest>=8"
      - name: Run request validation tests
        run: python -m pytest -q
